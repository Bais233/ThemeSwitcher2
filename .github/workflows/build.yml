name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: cargo build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThemeSwitcher2
          path: |
            target/release/ThemeSwitcher2.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (release)
        run: cargo build --release
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## 更新内容

            ### 修复
            - **主题持续跟随当前时段**: 以前只在日出/日落那一刻写主题, 若中间被手动改过、被其他程序改过、
              或休眠恢复后状态不对, 就会一直错到下一个日出/日落。现在每秒校验「当前主题是否等于此刻应有的」,
              不符即纠正(推迟期间不干预, 5 秒节流避免与手动操作拉锯)。
              想临时保留自己的选择, 用「推迟控制」即可。

            ### 改进
            - **新装指针包不必再重启程序**: 指针包目录缓存改为可失效, 托盘菜单「重读配置」会重新扫描
              `C:\Windows\Cursors`; 已存在的包内新增或替换指针文件原本就是即时生效的。

            ### 下载
            单个 `ThemeSwitcher2.exe`, 直接覆盖旧文件即可。
          files: |
            target/release/ThemeSwitcher2.exe
