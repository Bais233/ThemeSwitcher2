name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: cargo build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThemeSwitcher2
          path: |
            target/release/ThemeSwitcher2.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (release)
        run: cargo build --release
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## 更新内容

            ### 修复
            - **修复切换主题后鼠标指针两套混用**: 部分指针包把静态指针和动画指针拆进不同子目录
              (例如 W11 系列的 `base/` 与 `sunset/`) 时, 匹配只扫方案目录本层, 导致
              「后台运行」「忙」等角色匹配不到, 保留上一套方案的指针 —— 桌面上同时出现两套指针。
              现在会优先取本层文件, 缺失的角色用同一指针包内其余子目录补齐(不跨包)。
            - 补充 `precision` / `precision-select` 作为「精确选择」的识别别名
            - 未识别出的角色会写进日志, 不再完全静默跳过
            - 旧的方案名(如「W11_light_v2.2 base」)继续有效, 已保存的配置无需重新选择

            ### 下载
            单个 `ThemeSwitcher2.exe`, 直接覆盖旧文件即可。
          files: |
            target/release/ThemeSwitcher2.exe
