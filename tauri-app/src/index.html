<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ThemeSwitcher2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
    color: #f2f4f8;
    /* 窗口本体透明(acrylic 透出桌面), 这里铺半透明渐变让玻璃有折射源 */
    background: linear-gradient(160deg, rgba(28,30,44,.55), rgba(18,19,30,.72));
  }
  .topbar {
    height: 64px; display: flex; align-items: center; gap: 18px; padding: 0 20px;
    background: linear-gradient(180deg, rgba(18,20,30,.72), rgba(18,20,30,.5));
    border-bottom: 1px solid rgba(255,255,255,.13);
    backdrop-filter: blur(30px) saturate(150%);
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo .orb { width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, #ffd76a 0%, #ffd76a 50%, #2e3854 50%, #2e3854 100%);
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.55), 0 4px 14px rgba(0,0,0,.35); }
  .logo b { font-size: 15px; letter-spacing: .2px; white-space: nowrap; }
  .nav { display: flex; gap: 6px; white-space: nowrap; }
  .nav .item { display: flex; align-items: center; gap: 9px; padding: 9px 15px;
    border-radius: 12px; color: rgba(235,238,246,.62); font-size: 13.5px; cursor: default; }
  .nav .item svg { width: 16px; height: 16px; opacity: .85; }
  .nav .item.active { background: rgba(127,178,255,.16); border: 1px solid rgba(127,178,255,.35); color: #f2f4f8; }
  .nav .item.active::after { content: ""; display: block; }
  .spacer { flex: 1; }
  .engine { display: flex; align-items: center; gap: 7px; font-size: 11.5px; white-space: nowrap;
    padding: 6px 12px; border-radius: 999px;
    color: #34d399; background: rgba(52,211,153,.10); border: 1px solid rgba(52,211,153,.30); }
  .engine.bad { color: #f87171; background: rgba(248,113,113,.10); border-color: rgba(248,113,113,.35); }
  .engine .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; }
  .btns { display: flex; gap: 14px; color: rgba(235,238,246,.62); font-size: 13px; }
  .btns span { cursor: default; padding: 4px 6px; border-radius: 6px; }
  .btns span:hover { background: rgba(255,255,255,.1); }

  .bodywrap { height: calc(100% - 64px); overflow-y: auto; padding: 22px 30px 26px; }
  .head h1 { font-size: 25px; font-weight: 650; letter-spacing: .3px; margin-bottom: 18px; }

  .card {
    background: linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.035));
    border: 1px solid rgba(255,255,255,.13); border-top-color: rgba(255,255,255,.30);
    border-radius: 20px;
    backdrop-filter: blur(26px) saturate(150%);
    box-shadow: 0 16px 44px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.16);
    padding: 22px 24px; margin-bottom: 16px;
  }
  .label { color: rgba(235,238,246,.62); font-size: 12.5px; display: flex; align-items: center;
    gap: 8px; margin-bottom: 12px; }
  .label svg { width: 15px; height: 15px; }

  .hero { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .badge { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 999px;
    font-size: 12.5px; margin-bottom: 12px; color: #fca55d;
    background: rgba(252,165,93,.13); border: 1px solid rgba(252,165,93,.4); }
  .badge.light-on { color: #34d399; background: rgba(52,211,153,.12); border-color: rgba(52,211,153,.4); }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; }
  .big { font-size: 26px; font-weight: 650; letter-spacing: .2px; }
  .big small { font-size: 15px; color: rgba(235,238,246,.62); font-weight: 400; margin-left: 8px; }
  .metas { display: flex; gap: 34px; margin-top: 16px; }
  .metas .m { color: rgba(235,238,246,.62); font-size: 12px; }
  .metas .m b { display: block; color: #f2f4f8; font-size: 14px; margin-top: 4px; font-weight: 600; }

  .orb-btn { width: 96px; height: 96px; border-radius: 44% 56% 52% 48% / 48% 44% 56% 52%;
    display: flex; align-items: center; justify-content: center; flex: none; cursor: default; border: none;
    background: linear-gradient(135deg, rgba(126,168,255,.95), rgba(43,79,216,.8) 55%, rgba(16,27,69,.8));
    box-shadow: 0 14px 40px rgba(80,120,255,.35), inset 0 2px 6px rgba(255,255,255,.5), inset 0 -8px 18px rgba(0,0,0,.3); }
  .orb-btn.sun { background: linear-gradient(135deg, rgba(255,215,106,.9), rgba(232,147,58,.75) 55%, rgba(122,61,28,.7));
    box-shadow: 0 14px 40px rgba(232,147,58,.35), inset 0 2px 6px rgba(255,255,255,.5), inset 0 -8px 18px rgba(0,0,0,.25); }
  .orb-btn svg { width: 40px; height: 40px; filter: drop-shadow(0 2px 6px rgba(0,0,0,.4)); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid2 .card { margin-bottom: 0; }
  .switchrow { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; }
  .switchrow .t { font-size: 14px; }
  .switchrow .d { color: rgba(235,238,246,.62); font-size: 11.5px; margin-top: 3px; }
  .sw { width: 46px; height: 24px; border-radius: 999px; position: relative; flex: none; cursor: default;
    background: rgba(127,140,165,.35); border: 1px solid rgba(255,255,255,.14); }
  .sw.on { background: linear-gradient(135deg, #7fb2ff, #a8c8ff); border-color: transparent;
    box-shadow: 0 4px 14px rgba(127,178,255,.5); }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;
    border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); transition: left .18s; }
  .sw.on::after { left: 24px; }

  .stepper { display: inline-flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 12px;
    font-size: 14px; font-weight: 600;
    background: linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
    border: 1px solid rgba(255,255,255,.13); border-top-color: rgba(255,255,255,.30); }
  .stepper .bt { color: rgba(235,238,246,.62); font-size: 10px; display: flex; flex-direction: column;
    gap: 2px; cursor: default; }
  .stepper .bt span:hover { color: #fff; }

  select { width: 100%; padding: 10px 12px; border-radius: 12px; font-family: inherit; font-size: 13.5px;
    color: #f2f4f8; background: linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
    border: 1px solid rgba(255,255,255,.13); border-top-color: rgba(255,255,255,.30); outline: none; }
  select option { background: #20222e; color: #f2f4f8; }

  .foot { display: flex; align-items: center; justify-content: space-between; }
  .btn-primary { padding: 11px 26px; border-radius: 14px; color: #fff; font-size: 14px; font-weight: 600;
    cursor: default; border: 1px solid rgba(255,255,255,.25);
    background: linear-gradient(135deg, #96bcff, #7fb2ff 60%, #5d92e8);
    box-shadow: 0 10px 30px rgba(127,178,255,.45), inset 0 1px 0 rgba(255,255,255,.45); }
  .btn-primary:active { transform: translateY(1px); }
  .linkish { color: #7fb2ff; font-size: 13px; cursor: default; }
  .twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .colgap { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }
  .muted { color: rgba(235,238,246,.62); font-size: 11.5px; margin-top: 3px; }
</style>
</head>
<body>
  <div class="topbar" id="drag">
    <div class="logo"><span class="orb"></span><b>ThemeSwitcher2</b></div>
    <div class="nav">
      <div class="item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
        状态
      </div>
    </div>
    <div class="spacer"></div>
    <div class="engine" id="engine"><span class="dot"></span><span id="engineText">引擎检测中</span></div>
    <div class="btns">
      <span id="btnMin">─</span><span id="btnMax">▢</span><span id="btnClose">✕</span>
    </div>
  </div>

  <div class="bodywrap">
    <div class="head"><h1>状态</h1></div>

    <div class="card hero">
      <div>
        <div class="badge" id="modeBadge"><span class="dot"></span><span id="modeText">深色模式</span></div>
        <div class="big">下次切换 <span id="nextWhen">--:--</span> <small>→ <span id="nextMode">浅色</span></small></div>
        <div class="metas">
          <div class="m">定位<b id="loc">获取中…</b></div>
          <div class="m">日出<b id="sunrise">…</b></div>
          <div class="m">日落<b id="sunset">…</b></div>
        </div>
      </div>
      <button class="orb-btn" id="orbToggle" title="点击切换模式">
        <svg viewBox="0 0 24 24" fill="#fff" id="orbIcon"><path d="M20.6 14.2A8.6 8.6 0 0 1 9.8 3.4 8.6 8.6 0 1 0 20.6 14.2z"/></svg>
      </button>
    </div>

    <div class="grid2" style="margin-top:16px;">
      <div class="card">
        <div class="label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18" fill="currentColor" stroke="none" opacity=".5"/></svg>
          「深色模式」切换哪些项
        </div>
        <div class="switchrow"><div><div class="t">应用主题</div><div class="d">UWP / 资源管理器</div></div><div class="sw" id="swApps" data-key="switchApps"></div></div>
        <div class="switchrow"><div><div class="t">系统主题</div><div class="d">任务栏 / 开始菜单</div></div><div class="sw" id="swSystem" data-key="switchSystem"></div></div>
      </div>
      <div class="card">
        <div class="label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          切换时机偏移(分钟)
        </div>
        <div class="switchrow"><div class="t">日出</div><div class="stepper"><span id="offRise">0</span><span class="bt"><span data-d="1" data-k="sunriseOffsetMin">▲</span><span data-d="-1" data-k="sunriseOffsetMin">▼</span></span></div></div>
        <div class="switchrow"><div class="t">日落</div><div class="stepper"><span id="offSet">0</span><span class="bt"><span data-d="1" data-k="sunsetOffsetMin">▲</span><span data-d="-1" data-k="sunsetOffsetMin">▼</span></span></div></div>
      </div>
    </div>

    <div class="colgap">
      <div class="card">
        <div class="label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l7 17 2.5-6.5L21 11 5 3z"/></svg>
          鼠标指针 · 同步切换
        </div>
        <div class="twocol">
          <div>
            <div class="switchrow" style="padding-top:0;"><div class="t">浅色方案</div></div>
            <select id="pickLight"></select>
          </div>
          <div>
            <div class="switchrow" style="padding-top:0;"><div class="t">深色方案</div></div>
            <select id="pickDark"></select>
          </div>
        </div>
        <div class="switchrow" style="margin-top:6px;"><div><div class="t">跟随主题自动切换指针</div><div class="d">识别不到当前方案时保持现状</div></div><div class="sw" id="swCursor" data-key="switchCursor"></div></div>
      </div>

      <div class="card foot">
        <div class="switchrow" style="padding:0;"><div><div class="t">开机自启</div><div class="d">HKCU Run</div></div><div class="sw" id="swAuto" data-key="autostart"></div></div>
        <div style="display:flex;align-items:center;gap:22px;">
          <span class="linkish" id="btnConfig">打开配置文件</span>
          <button class="btn-primary" id="btnSave">保存并关闭</button>
        </div>
      </div>
    </div>
  </div>

<script>
  const T = window.__TAURI__;
  const invoke = T.core.invoke;
  const curWin = T.window.getCurrentWindow();

  let cfg = {};
  let lastStatusKey = '';

  // ---- 窗口控制 ----
  document.getElementById('btnMin').onclick = () => curWin.minimize();
  document.getElementById('btnMax').onclick = () => curWin.toggleMaximize();
  document.getElementById('btnClose').onclick = () => curWin.close();
  document.getElementById('drag').onmousedown = (e) => {
    if (e.target.closest('.nav,.engine,.btns')) return;
    curWin.startDragging();
  };

  // ---- 开关 ----
  document.querySelectorAll('.sw[data-key]').forEach(el => {
    el.onclick = () => {
      const k = el.dataset.key;
      cfg[k] = !(cfg[k] === true);
      el.classList.toggle('on', cfg[k] === true);
      save();
    };
  });

  // ---- 偏移 stepper ----
  document.querySelectorAll('.bt span[data-k]').forEach(el => {
    el.onclick = () => {
      const k = el.dataset.k, d = parseInt(el.dataset.d);
      cfg[k] = Math.max(-720, Math.min(720, (cfg[k] || 0) + d));
      renderCfg();
      save();
    };
  });

  // ---- 下拉 ----
  document.getElementById('pickLight').onchange = e => { cfg.cursorLightScheme = e.target.value; save(); };
  document.getElementById('pickDark').onchange = e => { cfg.cursorDarkScheme = e.target.value; save(); };

  // ---- 按钮 ----
  document.getElementById('orbToggle').onclick = async () => {
    await invoke('set_theme', { light: !cfg._light });
  };
  document.getElementById('btnSave').onclick = () => save();
  document.getElementById('btnConfig').onclick = async () => {
    await invoke('open_config');
  };

  async function save() {
    try { await invoke('save_settings', { newSettings: cfg }); } catch (e) { console.error(e); }
  }

  function renderCfg() {
    document.getElementById('swApps').classList.toggle('on', cfg.switchApps === true);
    document.getElementById('swSystem').classList.toggle('on', cfg.switchSystem === true);
    document.getElementById('swCursor').classList.toggle('on', cfg.switchCursor === true);
    document.getElementById('swAuto').classList.toggle('on', cfg.autostart === true);
    document.getElementById('offRise').textContent = cfg.sunriseOffsetMin ?? 0;
    document.getElementById('offSet').textContent = cfg.sunsetOffsetMin ?? 0;
  }

  function fillSchemes(list, lightVal, darkVal) {
    const mk = (id, val) => {
      const el = document.getElementById(id);
      el.innerHTML = '';
      const opts = val && !list.includes(val) ? [val, ...list] : list;
      for (const s of opts) {
        const o = document.createElement('option');
        o.value = s; o.textContent = s;
        el.appendChild(o);
      }
      el.value = val || (list[0] ?? '');
    };
    mk('pickLight', lightVal);
    mk('pickDark', darkVal);
  }

  // ---- 轮询 ----
  async function tickStatus() {
    try {
      const st = await invoke('get_status');
      const key = JSON.stringify(st);
      if (key === lastStatusKey) return;
      lastStatusKey = key;
      cfg._light = st.light === true;
      document.getElementById('nextWhen').textContent = st.nextWhen || '--:--';
      document.getElementById('nextMode').textContent = st.nextLight ? '浅色' : '深色';
      document.getElementById('loc').textContent = st.locationResolved || '获取中…';
      document.getElementById('sunrise').textContent = st.sunrise || '…';
      document.getElementById('sunset').textContent = st.sunset || '…';
      const badge = document.getElementById('modeBadge');
      badge.classList.toggle('light-on', st.light === true);
      document.getElementById('modeText').textContent = st.light ? '浅色模式' : '深色模式';
      document.getElementById('orbIcon').innerHTML = st.light
        ? '<circle cx="12" cy="12" r="4.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1" stroke="#fff" stroke-width="2" stroke-linecap="round"/>'
        : '<path d="M20.6 14.2A8.6 8.6 0 0 1 9.8 3.4 8.6 8.6 0 1 0 20.6 14.2z"/>';
      document.getElementById('orbToggle').classList.toggle('sun', st.light === true);
      const eng = document.getElementById('engine');
      eng.classList.toggle('bad', false);
      document.getElementById('engineText').textContent = '引擎运行中';
    } catch (e) {
      const eng = document.getElementById('engine');
      eng.classList.add('bad');
      document.getElementById('engineText').textContent = '引擎未响应';
    }
  }

  async function boot() {
    try {
      const list = await invoke('list_schemes');
      cfg = await invoke('get_settings');
      fillSchemes(list, cfg.cursorLightScheme, cfg.cursorDarkScheme);
      renderCfg();
    } catch (e) { console.error(e); }
    await tickStatus();
    setInterval(tickStatus, 1000);
  }
  boot();
</script>
</body>
</html>
