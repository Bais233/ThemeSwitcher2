[package]
name = "themeswitcher2-tauri"
version = "2.0.0"
edition = "2021"
description = "ThemeSwitcher2 玻璃仪表盘(Tauri 2 + WebView2)"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.5"
themeswitcher2 = { path = "../.." }
