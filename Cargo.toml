[package]
name = "themeswitcher2"
version = "2.0.0"
edition = "2021"
description = "ThemeSwitcher2 — 按日出日落自动切换 Windows 深色/浅色模式与鼠标指针(Rust 重写版)"
license = "MIT"

[[bin]]
name = "ThemeSwitcher2"
path = "src/main.rs"

[dependencies]
tao = "0.30"
tray-icon = "0.19"
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
ureq = "2"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
chrono = "0.4"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
